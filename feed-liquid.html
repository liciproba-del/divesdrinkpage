<title>Dives — feed liquid (prototype)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100svh;font-family:system-ui,sans-serif;color:#fff;
  background:radial-gradient(120% 90% at 50% 0%, #241233, #0d0716 70%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:26px 16px}
.note{font-weight:700;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55);text-align:center}
.post{position:relative;width:min(420px,92vw);border-radius:16px;overflow:hidden;
  box-shadow:0 30px 70px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.06)}
.media{position:relative;width:100%;aspect-ratio:768/1372;display:block}
.media .photo{width:100%;height:100%;object-fit:cover;display:block}
/* the animated pour rides on top of the real stream and only brightens it */
.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:screen}
.flow{animation:flow .6s linear infinite}
.flow2{animation:flow2 .48s linear infinite}
.drop{animation:flow3 .95s linear infinite}
@keyframes flow{to{stroke-dashoffset:-220}}
@keyframes flow2{to{stroke-dashoffset:-265}}
@keyframes flow3{to{stroke-dashoffset:-408}}
.paused .flow,.paused .flow2,.paused .drop{animation-play-state:paused}
.controls{display:flex;gap:10px;align-items:center}
/* liquid launch button (uiverse tall-mayfly, recoloured to Dives red) */
.launch{background:#0d0713;border:0;outline:0;color:#fff;min-width:216px;padding:18px 28px;border-radius:50px;
  position:relative;overflow:hidden;cursor:pointer;font-family:inherit;font-weight:800;letter-spacing:.4px}
.launch .liquid{background:#ff2b40;width:100%;height:66px;position:absolute;bottom:0;left:0;
  box-shadow:inset 5px -5px 25px #9e0f22, inset -5px 0 25px #9e0f22;transition:height .5s ease}
.launch .liquid::after{content:'';width:480px;height:400px;background:#0d0713;z-index:1;position:absolute;
  left:-130px;top:-380px;border-radius:45%;animation:liq 5s linear 2s infinite}
.launch .liquid::before{content:'';width:480px;height:400px;background:#ff5470;z-index:1;position:absolute;
  left:-130px;top:-380px;border-radius:40%;animation:liq 5s linear 1.8s infinite}
.launch .btn-txt{position:relative;z-index:2;font-size:1.02rem}
.launch.playing .liquid{height:100%}
@keyframes liq{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.flow,.flow2,.drop,.launch .liquid::after,.launch .liquid::before{animation:none}}
</style>
</head>

    <svg class="fx" id="fx" viewBox="0 0 768 1372" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <defs>
        <linearGradient id="hi" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffdcea"/>
        </linearGradient>
        <linearGradient id="rose" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffd9e6" stop-opacity=".0"/>
          <stop offset=".5" stop-color="#ffcadd" stop-opacity=".45"/>
          <stop offset="1" stop-color="#f7b8d0" stop-opacity=".18"/>
        </linearGradient>
        <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="2.4"/>
        </filter>
        <!-- fade the synthetic highlights in just below the spout and OUT near the mouth,
             so the pour never lights up brighter than the real stream at its ends -->
        <linearGradient id="fadeGrad" x1="0" y1="470" x2="0" y2="1058" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#000"/>
          <stop offset="0.13" stop-color="#fff"/>
          <stop offset="0.62" stop-color="#fff"/>
          <stop offset="0.85" stop-color="#8a8a8a"/>
          <stop offset="1" stop-color="#000"/>
        </linearGradient>
        <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="380" width="768" height="780">
          <rect x="0" y="380" width="768" height="780" fill="url(#fadeGrad)"/>
        </mask>
      </defs>

      <!-- the pour path: traced down the CENTRE of the real stream, ending at the lips -->
      <path id="stream" d="M395,470 C386,560 383,660 384,760 C385,880 387,970 388,1058" fill="none"/>

      <g mask="url(#fade)">
        <!-- soft continuous rosé body of the stream -->
        <use href="#stream" stroke="url(#rose)" stroke-width="11" stroke-linecap="round" filter="url(#soft)"/>
        <!-- bloom under the highlights -->
        <use href="#stream" stroke="url(#hi)" stroke-width="7" stroke-linecap="round"
             stroke-dasharray="10 210" opacity=".5" filter="url(#soft)" class="flow"/>
        <!-- crisp flowing highlights (the sense of movement) -->
        <use href="#stream" stroke="url(#hi)" stroke-width="4" stroke-linecap="round"
             stroke-dasharray="9 211" class="flow"/>
        <!-- faster thin glints -->
        <use href="#stream" stroke="#ffffff" stroke-width="2" stroke-linecap="round"
             stroke-dasharray="5 260" opacity=".9" class="flow2"/>
        <!-- occasional fatter droplet running down -->
        <use href="#stream" stroke="url(#hi)" stroke-width="5.5" stroke-linecap="round"
             stroke-dasharray="8 400" opacity=".8" filter="url(#soft)" class="drop"/>
      </g>
    </svg>

<div class="controls">
  <button class="launch" id="launch" type="button">
    <span class="liquid"></span>
    <span class="btn-txt">Clicca e versa</span>
  </button>
</div>

<script>
(function(){
  const media=document.getElementById('media'), btn=document.getElementById('launch');
  media.classList.add('paused');                 // start static — the pour launches on click
  let on=false;
  btn.addEventListener('click',()=>{ on=!on;
    media.classList.toggle('paused',!on);
    btn.classList.toggle('playing',on);
    btn.querySelector('.btn-txt').textContent = on ? 'Ferma il sorso' : 'Clicca e versa'; });
})();
</script>
