<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dives — logo (Diverso &#8594; Dives)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--red:#ff2b40;--blue:#3d7bff}
body{min-height:100svh;font-family:"Manrope",system-ui,sans-serif;color:#fff;
  background:
   radial-gradient(120% 80% at 18% 8%, rgba(255,43,64,.34), transparent 55%),
   radial-gradient(120% 80% at 84% 10%, rgba(61,123,255,.4), transparent 55%),
   radial-gradient(140% 120% at 50% 125%, #2a1140 0%, #180d2c 44%, #0d0720 100%),
   linear-gradient(180deg,#ff8a5c 0%, #ff5e86 22%, #7b2ff7 55%, #180d2c 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:40px 16px}
.note{position:fixed;top:14px;left:0;right:0;text-align:center;font-weight:700;font-size:.74rem;letter-spacing:.16em;
  text-transform:uppercase;color:rgba(255,255,255,.6)}
.logo-stage{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.lbl{font-weight:800;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.72);
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:5px 14px}
.stage{position:relative;width:min(1040px,94vw);height:clamp(190px,26vw,300px)}
.frame{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.frame .word{position:relative;height:82%}
.frame .word img.base{display:block;height:100%;width:auto;filter:drop-shadow(0 8px 24px rgba(0,0,0,.4))}
.fDives .word .crop,.fDives .word .pieces{position:absolute;left:0;top:0;height:100%;width:auto}
.fDives .word .crop{opacity:0}
.fDives .word .pieces{z-index:3;will-change:transform,opacity}
.fDiverso .word .oL{position:absolute;height:auto;z-index:4;transform-origin:center;will-change:transform,opacity;
  filter:drop-shadow(0 8px 24px rgba(0,0,0,.4))}
.fDives{opacity:0}
.cleaver{position:absolute;left:44%;top:6%;width:48%;height:auto;z-index:6;opacity:0;transform-origin:50% 60%;
  filter:drop-shadow(0 10px 16px rgba(0,0,0,.5)) drop-shadow(0 0 8px rgba(255,255,255,.25));pointer-events:none}
.settle{animation:settle .55s ease-out}
@keyframes settle{0%{transform:translateY(0)}42%{transform:translateY(-5px)}100%{transform:translateY(0)}}
.flash{position:absolute;left:0;top:0;height:100%;width:auto;z-index:5;opacity:0;pointer-events:none;
  mix-blend-mode:screen}
.replay{font-weight:800;font-size:.86rem;color:#fff;background:rgba(255,255,255,.12);border:1.4px solid rgba(255,255,255,.25);
  border-radius:999px;padding:9px 20px;cursor:pointer;backdrop-filter:blur(6px)}
.replay:hover{background:rgba(255,255,255,.2)}
@media(prefers-reduced-motion:reduce){.cleaver{display:none}}

/* ===== ONE-LINE logo (REAL wordmark letters) — o rolls, r->cleaver, ves spring to Dives ===== */
.olstage{position:relative;width:min(1040px,94vw);height:clamp(190px,26vw,300px);display:flex;align-items:center;justify-content:center;overflow:visible}
.olword{position:relative;width:min(1000px,92vw);height:auto}
.olc,.oldives,.olcrop,.olpieces{position:absolute;height:auto;display:block;filter:drop-shadow(0 8px 24px rgba(0,0,0,.4));will-change:transform,opacity}
.olc[data-k=D]{filter:drop-shadow(0 0 26px rgba(255,60,90,.5)) drop-shadow(0 8px 24px rgba(0,0,0,.4))}
.olc[data-k=i]{filter:drop-shadow(0 0 26px rgba(255,60,90,.5)) drop-shadow(0 8px 24px rgba(0,0,0,.4))}
.olc[data-k=r]{filter:drop-shadow(0 0 26px rgba(255,60,90,.5)) drop-shadow(0 8px 24px rgba(0,0,0,.4))}
.olc[data-k=v],.olc[data-k=e],.olc[data-k=s],.olc[data-k=o]{filter:drop-shadow(0 0 30px rgba(61,123,255,.55)) drop-shadow(0 8px 24px rgba(0,0,0,.4))}
.oldives,.olcrop{filter:drop-shadow(0 0 30px rgba(120,90,255,.4)) drop-shadow(0 8px 24px rgba(0,0,0,.4))}
.oldives,.olcrop,.olpieces{opacity:0}
.olpieces{z-index:5;filter:drop-shadow(0 0 22px rgba(61,123,255,.5))}
.olknife{position:absolute;left:0;top:0;height:auto;z-index:6;opacity:0;pointer-events:none;
  filter:drop-shadow(0 10px 16px rgba(0,0,0,.5)) drop-shadow(0 0 8px rgba(255,255,255,.25));will-change:transform,opacity}
@keyframes olSettle{0%{transform:translateY(0)}40%{transform:translateY(-3%)}100%{transform:translateY(0)}}
.olsettle{animation:olSettle .5s ease-out}
@media(prefers-reduced-motion:reduce){.olc,.oldives{opacity:0}.olcrop{opacity:1}}

/* ===== ONE-LINE variante B — Diverso WHITE (r/o coloured) -> colour on collapse; correct neon ONLY on final cropped ===== */
.ol2word{position:relative;width:min(1000px,92vw);height:auto}
.ol2c,.ol2dives,.ol2cd,.ol2cv,.ol2pieces{position:absolute;height:auto;display:block;will-change:transform,opacity}
.ol2c{filter:drop-shadow(0 0 10px rgba(255,255,255,.28)) drop-shadow(0 6px 18px rgba(0,0,0,.42))}
.ol2c[data-k=r]{filter:drop-shadow(0 0 16px rgba(255,43,64,.6)) drop-shadow(0 0 30px rgba(255,43,64,.34)) drop-shadow(0 6px 18px rgba(0,0,0,.42))}
.ol2c[data-k=o]{filter:drop-shadow(0 0 16px rgba(61,123,255,.6)) drop-shadow(0 0 30px rgba(61,123,255,.34)) drop-shadow(0 6px 18px rgba(0,0,0,.42))}
.ol2dives{opacity:0;filter:drop-shadow(0 8px 24px rgba(0,0,0,.4))}
.ol2cd{opacity:0;filter:drop-shadow(0 0 16px rgba(255,43,64,.72)) drop-shadow(0 0 34px rgba(255,43,64,.42)) drop-shadow(0 8px 22px rgba(0,0,0,.4))}
.ol2cv{opacity:0;filter:drop-shadow(0 0 16px rgba(61,123,255,.72)) drop-shadow(0 0 34px rgba(61,123,255,.42)) drop-shadow(0 8px 22px rgba(0,0,0,.4))}
.ol2pieces{opacity:0;z-index:5;filter:drop-shadow(0 0 18px rgba(61,123,255,.5))}
.ol2knife{position:absolute;left:0;top:0;height:auto;z-index:6;opacity:0;pointer-events:none;
  filter:drop-shadow(0 10px 16px rgba(0,0,0,.5)) drop-shadow(0 0 8px rgba(255,255,255,.25));will-change:transform,opacity}
@media(prefers-reduced-motion:reduce){.ol2c,.ol2dives{opacity:0}.ol2cd,.ol2cv{opacity:1}}
</style></head>

<script>
const CHOP={
 '1l':{base:{left:'44%',top:'4%',width:'48%'},
   init:'translate(34%,-150%) rotate(-30deg) scale(.95)',
   wind:'translate(26%,-52%) rotate(-22deg) scale(1)',
   slice:'translate(-6%,22%) rotate(-5deg) scale(1)',
   off:'translate(-64%,80%) rotate(16deg) scale(1)'},
 '2l':{base:{left:'30%',top:'44%',width:'66%'},
   init:'translate(30%,-120%) rotate(-30deg) scale(.95)',
   wind:'translate(24%,-40%) rotate(-22deg) scale(1)',
   slice:'translate(-6%,16%) rotate(-6deg) scale(1)',
   off:'translate(-58%,74%) rotate(16deg) scale(1)'}
};
function runStage(stage){
  const tag=stage.dataset.tag, cfg=CHOP[tag];
  const fDiv=stage.querySelector('.fDiverso'), fDives=stage.querySelector('.fDives');
  const oL=stage.querySelector('.oL'), full=stage.querySelector('.full'), crop=stage.querySelector('.crop');
  const pieces=stage.querySelector('.pieces'), cleaver=stage.querySelector('.cleaver');
  const word=fDives.querySelector('.word');
  let timers=[]; const A=(ms,fn)=>timers.push(setTimeout(fn,ms));
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  function reset(){
    timers.forEach(clearTimeout); timers=[];
    fDiv.style.transition='none'; fDiv.style.opacity='1';
    fDives.style.transition='none'; fDives.style.opacity='0'; word.classList.remove('settle');
    oL.style.transition='none'; oL.style.transform='none'; oL.style.opacity='1';
    full.style.transition='none'; full.style.opacity='1';
    crop.style.transition='none'; crop.style.opacity='0';
    pieces.style.transition='none'; pieces.style.transform='none'; pieces.style.opacity='1';
    cleaver.style.left=cfg.base.left; cleaver.style.top=cfg.base.top; cleaver.style.width=cfg.base.width;
    cleaver.style.transition='none'; cleaver.style.transform=cfg.init; cleaver.style.opacity='0';
    void stage.offsetWidth;
  }
  function play(){
